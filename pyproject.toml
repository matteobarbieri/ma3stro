[project]
name = "ma3stro"
version = "0.1.0"
description = "Play a backing track with a large ASCII clock and side cues for upcoming song parts."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "sounddevice>=0.4.6",
    "numpy>=1.24",
    "pydub>=0.25.1",
    "rich>=13.7",
    "pyyaml>=6.0",
    "audioop-lts>=0.2.1; python_version >= '3.13'",
]

[project.scripts]
ma3stro = "ma3stro.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ma3stro"]
